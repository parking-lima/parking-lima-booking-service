
name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runtime
          tags: |
            ghcr.io/parking-lima/parking-lima-booking-service:latest
            ghcr.io/parking-lima/parking-lima-booking-service:sha-${{ github.sha }}

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: migrations
          tags: |
            ghcr.io/parking-lima/parking-lima-booking-service:latest-migrations
            ghcr.io/parking-lima/parking-lima-booking-service:sha-${{ github.sha }}-migrations
